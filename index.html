<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4eef7">
  <meta name="description" content="個人用成績追蹤前端原型，可記錄分數、看趨勢與能力多邊形圖。">
  <link rel="stylesheet" href="styles.css?v=20260818-1">
  <title>成績帳本</title>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">My Score Tracker</p>
        <h1>成績帳本</h1>
      </div>
      <button id="settingsButton" class="icon-button" type="button" aria-expanded="false" aria-controls="settingsPanel">設定</button>
    </header>

    <section class="settings-panel" id="settingsPanel" hidden>
      <div class="settings-grid">
        <label>
          暱稱
          <input id="profileName" maxlength="24" placeholder="我">
        </label>
        <label>
          風格
          <select id="themeSelect">
            <option value="soft">柔和粉</option>
            <option value="soft-blue">柔和藍</option>
            <option value="soft-yellow">柔和黃</option>
            <option value="soft-green">柔和綠</option>
            <option value="tech">暗黑科技</option>
            <option value="plain">簡潔</option>
          </select>
        </label>
        <label>
          能力圖
          <select id="radarMode">
            <option value="combined">合併五軸</option>
            <option value="split">拆分細科</option>
          </select>
        </label>
        <label>
          趨勢科目
          <select id="trendSubject"></select>
        </label>
        <label>
          考試類型
          <select id="trendType">
            <option value="all">全部類型</option>
            <option value="模擬考">模擬考</option>
            <option value="期中考">期中考</option>
            <option value="段考">段考</option>
            <option value="小考">小考</option>
            <option value="練習卷">練習卷</option>
          </select>
        </label>
        <label>
          合科解讀
          <select id="trendSubjectMode">
            <option value="related">包含合科/分科</option>
            <option value="exact">只看原始科目</option>
          </select>
        </label>
      </div>
      <div class="settings-actions">
        <button id="resetDemo" type="button" class="ghost-button">載入範例</button>
        <button id="exportButton" type="button" class="ghost-button">匯出 CSV</button>
        <label class="file-button">
          匯入 CSV
          <input id="importFile" type="file" accept=".csv,text/csv">
        </label>
      </div>
    </section>

    <nav class="tabbar" role="tablist" aria-label="成績帳本功能">
      <button class="tab-button" id="overviewTab" type="button" role="tab" aria-selected="true" aria-controls="overviewPanel" data-tab="overview">顯示</button>
      <button class="tab-button" id="inputTab" type="button" role="tab" aria-selected="false" aria-controls="inputPanel" data-tab="input" tabindex="-1">輸入</button>
    </nav>

    <section class="tab-panel" id="overviewPanel" role="tabpanel" aria-labelledby="overviewTab" data-tab-panel="overview">
      <section class="hero-card" id="shareCard">
        <div>
          <p class="muted-label" id="profileLabel">我的近況</p>
          <p class="hero-score" id="shareScore">-</p>
          <p class="hero-text" id="shareText">先記一筆分數，這裡會變成你的能力曲線摘要。</p>
        </div>
        <div class="hero-actions">
          <button id="copySummary" type="button" class="ghost-button">複製摘要</button>
        </div>
      </section>

      <section class="quick-stats" aria-label="成績摘要">
        <article>
          <span class="stat-title">最近平均</span>
          <strong class="stat-value" id="latestAverage">-</strong>
        </article>
        <article>
          <span class="stat-title">穩定科目</span>
          <span class="stat-subject" id="bestSubjectName">-</span>
          <strong class="stat-value" id="bestSubjectScore">-</strong>
        </article>
        <article>
          <span class="stat-title">待加強</span>
          <span class="stat-subject" id="watchSubjectName">-</span>
          <strong class="stat-value" id="watchSubjectScore">-</strong>
        </article>
      </section>

      <section class="dashboard">
        <section class="panel trend-panel">
          <div class="panel-head">
            <h2>走勢</h2>
            <span id="recordCount">0 筆</span>
          </div>
          <canvas id="trendChart" width="920" height="360" aria-label="成績折線趨勢圖"></canvas>
        </section>

        <section class="panel radar-panel">
          <div class="panel-head">
            <h2>能力圖</h2>
            <span id="radarModeLabel">合併五軸</span>
          </div>
          <canvas id="radarChart" width="520" height="420" aria-label="科目能力多邊形圖"></canvas>
        </section>
      </section>

      <section class="panel records-panel">
        <div class="panel-head">
          <h2>最近紀錄</h2>
          <select id="recordTypeFilter" aria-label="記錄類型篩選">
            <option value="all">全部</option>
            <option value="模擬考">模擬考</option>
            <option value="期中考">期中考</option>
            <option value="段考">段考</option>
            <option value="小考">小考</option>
            <option value="練習卷">練習卷</option>
          </select>
        </div>
        <input id="searchInput" class="quiet-search" type="search" placeholder="搜尋科目或備註">
        <div class="records-list" id="recordsList"></div>
      </section>
    </section>

    <section class="tab-panel" id="inputPanel" role="tabpanel" aria-labelledby="inputTab" data-tab-panel="input" hidden>
      <section class="panel add-panel">
        <div class="panel-head">
          <h2>記一筆</h2>
        </div>
        <form id="scoreForm" class="score-form">
          <input id="studentName" name="studentName" type="hidden">
          <div class="form-row">
            <label>
              日期
              <input id="examDate" name="examDate" type="date" required>
            </label>
            <label>
              類型
              <select id="examType" name="examType" required>
                <option value="模擬考">模擬考</option>
                <option value="期中考">期中考</option>
                <option value="段考">段考</option>
                <option value="小考">小考</option>
                <option value="練習卷">練習卷</option>
              </select>
            </label>
            <label>
              科目
              <select id="subject" name="subject" required></select>
            </label>
          </div>
          <div class="form-row compact">
            <label>
              得分
              <input id="score" name="score" type="number" inputmode="decimal" min="0" step="0.5" placeholder="86" required>
            </label>
            <label>
              滿分
              <input id="maxScore" name="maxScore" type="number" inputmode="decimal" min="1" step="1" value="100" required>
            </label>
            <label>
              備註
              <input id="note" name="note" maxlength="80" placeholder="可空白">
            </label>
          </div>
          <div class="form-actions">
            <button id="cancelEdit" type="button" class="ghost-button" hidden>取消</button>
            <button id="saveButton" type="submit">儲存</button>
          </div>
        </form>
      </section>
    </section>
  </main>

  <script src="scripts/app.js?v=20260818-1"></script>
</body>
</html>
